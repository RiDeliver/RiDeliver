<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiDeliver.ph</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-bold text-blue-600 cursor-pointer" onclick="switchTab('home')">RiDeliver.ph</span>
            <nav class="flex space-x-2">
                <button onclick="switchTab('home')" class="px-3 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg">Home</button>
                <button onclick="switchTab('menu')" class="px-3 py-2 text-sm font-medium text-slate-600">Menu</button>
                <button onclick="switchTab('tracker')" class="px-3 py-2 text-sm font-medium text-slate-600">Tracker</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-10">
        <!-- Home Tab -->
        <div id="tab-home" class="tab-pane text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-4">Fast Food & Gadget Delivery</h1>
            <p class="text-slate-600 mb-6">Mabilis at maaasahang paghahatid sa iyong pintuan.</p>
            <button onclick="switchTab('menu')" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold">Mag-order Na</button>
        </div>

        <!-- Menu Tab -->
        <div id="tab-menu" class="tab-pane hidden">
            <h2 class="text-2xl font-bold text-slate-900 mb-4">Pumili ng Pagkain o Gadget</h2>
            <div class="bg-white p-4 rounded-xl border shadow-sm mb-4">
                <h3 class="font-bold">Crispy Pata Special - ₱450</h3>
                <button onclick="alert('Naidagdag na sa cart!')" class="mt-2 bg-slate-900 text-white text-xs px-4 py-2 rounded-lg">Add to Cart</button>
            </div>
        </div>

        <!-- Tracker Tab -->
        <div id="tab-tracker" class="tab-pane hidden">
            <h2 class="text-2xl font-bold text-slate-900 mb-4">Order Status Tracker</h2>
            <input type="text" placeholder="Ilagay ang Tracking ID" class="w-full px-3 py-2 border rounded-xl mb-3">
            <button onclick="alert('Ang iyong order ay On the Way na!')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">I-track</button>
        </div>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
